name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run as the first stage of a release (see release.yml).
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Format
        run: dotnet format DisplaySwitch.slnx --verify-no-changes
      - name: Build (warnings are errors)
        run: dotnet build DisplaySwitch.slnx -c Release
      - name: Test
        run: dotnet test DisplaySwitch.slnx -c Release --no-build
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: tests/DisplaySwitch.App.Tests/bin/Release/net10.0/screenshots
          if-no-files-found: ignore
