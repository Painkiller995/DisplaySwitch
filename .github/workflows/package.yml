name: Package

# Builds all installers. Reused by release.yml; can also be run manually.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional. Builds are unsigned when unset.
      SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare signing certificate
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          "SIGN_CERT_PATH=$path" >> $env:GITHUB_ENV
      - name: Build installer and portable zip
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SkipTests
      - name: Remove signing certificate
        if: always() && env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: artifacts/installer/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash packaging/linux/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/installer/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: bash packaging/macos/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/installer/*
          if-no-files-found: error
